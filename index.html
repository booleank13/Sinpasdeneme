<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinpaş Tasarruf Koşusu</title>
    <style>
        /* Resets */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #ad-container {
            width: 320px;
            height: 480px;
            position: relative;
            background-color: #333;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .score-box { font-size: 18px; color: #FFCC00; }
        .logo-box img { height: 25px; }

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px;
            text-align: center;
            transition: opacity 0.3s;
            pointer-events: auto;
        }
        .screen.hidden { opacity: 0; pointer-events: none; }

        h1 { font-size: 26px; color: #D42E12; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 14px; color: #ddd; margin-bottom: 25px; line-height: 1.5; }

        .btn-start {
            background: #D42E12; color: white; border: none; padding: 15px 40px;
            font-size: 20px; font-weight: 800; border-radius: 30px;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 46, 18, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Form styling */
        .form-group { width: 100%; margin-bottom: 15px; }
        .form-input {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            font-size: 14px; background: #fff; color: #333;
        }
        .final-score { font-size: 32px; color: #FFCC00; font-weight: 800; margin: 10px 0 20px 0; }
    </style>
</head>
<body>

    <div id="ad-container">
        <!-- Canvas Game Layer -->
        <canvas id="gameCanvas" width="320" height="480"></canvas>

        <!-- HUD -->
        <div class="hud" id="hud" style="display:none;">
            <div class="logo-box"><img src="https://www.sinpasyts.com/arabalanding/assets/images/logo.png" alt="Sinpaş"></div>
            <div class="score-box"><span id="scoreDisplay">0</span> TL</div>
        </div>

        <!-- Start Screen -->
        <div class="screen" id="startScreen">
            <img src="https://www.sinpasyts.com/arabalanding/assets/images/logo.png" style="height: 40px; margin-bottom: 20px;">
            <h1>Faizden Kaç<br>Tasarrufu Yakala</h1>
            <p>Faiz engellerinden kaçın, birikimleri topla ve hayalindeki eve veya arabaya ulaş!</p>
            <button class="btn-start" onclick="startGame()">BAŞLA</button>
        </div>

        <!-- End Screen (Lead Form) -->
        <div class="screen hidden" id="endScreen">
            <h1 style="font-size: 20px;">Tebrikler!</h1>
            <p style="margin-bottom: 5px;">Toplam Tasarruf Tutarınız:</p>
            <div class="final-score" id="finalScoreDisplay">0 TL</div>
            <p style="font-size: 12px; margin-bottom: 15px;">Bu fırsatı kaçırmamak için bilgilerinizi bırakın.</p>

            <div class="form-group">
                <input type="text" id="name" class="form-input" placeholder="Adınız Soyadınız">
            </div>
            <div class="form-group">
                <input type="tel" id="phone" class="form-input" placeholder="Telefon Numaranız">
            </div>
            <button class="btn-start" onclick="submitLead()" style="font-size: 16px; padding: 12px 30px;">FIRSATI YAKALA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId;
        let score = 0;
        let speed = 5;
        let playerX = 160;
        let isGameOver = false;
        let gameTime = 0;

        // Game Assets
        const lanes = [60, 160, 260]; // 3 lanes x-coordinates
        let entities = []; // Obstacles and Coins
        let particles = [];

        // Branding Colors
        const COLOR_RED = '#D42E12';
        const COLOR_GOLD = '#FFCC00';
        const COLOR_ROAD = '#444';
        const COLOR_GRASS = '#2e8b57';

        // URLs
        const urlAraba = "https://www.sinpasyts.com/arabalanding/?utm_source=tagon-cpm-crmmedya&utm_medium=desktop-postitial&utm_campaign=kirmizi-tablo-yeni-aracini-alacaklara-mujde-arac-finansmaninda-beklenen-destek";
        const urlEv = "https://www.sinpasyts.com/";
        let selectedPath = null; // 'ev' or 'araba'

        // --- Input Handling ---
        let isDragging = false;

        function handleInput(x) {
            if (isGameOver) return;
            // Simple follow logic with smoothing
            // Clamp to road boundaries
            if (x < 20) x = 20;
            if (x > 300) x = 300;
            playerX = x;
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; handleInput(e.offsetX); });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mousemove', (e) => { if(isDragging) handleInput(e.offsetX); });

        canvas.addEventListener('touchstart', (e) => { isDragging = true; handleInput(e.touches[0].clientX - canvas.getBoundingClientRect().left); });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(isDragging) handleInput(e.touches[0].clientX - canvas.getBoundingClientRect().left);
        });
        window.addEventListener('touchend', () => isDragging = false);


        // --- Game Logic ---

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            isGameOver = false;
            score = 0;
            gameTime = 0;
            entities = [];
            particles = [];
            playerX = 160;
            loop();
        }

        function spawnEntity() {
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const type = Math.random() > 0.4 ? 'bad' : 'good'; // 60% bad, 40% good

            entities.push({
                x: lane,
                y: -50,
                type: type,
                active: true,
                scale: 0
            });
        }

        function update() {
            gameTime++;
            speed = 5 + (gameTime / 500); // Gradually speed up

            // Spawn logic
            if (gameTime % 40 === 0 && gameTime < 1000) {
                spawnEntity();
            }

            // End game sequence trigger
            if (gameTime === 1000) {
                // Spawn the final gates
                entities = []; // Clear current
                entities.push({ type: 'gates', y: -400, active: true });
            }

            // Update entities
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.y += speed;

                // Spawn animation
                if (e.scale < 1) e.scale += 0.1;

                if (e.type === 'gates') {
                    // Check collision with gates logic
                    if (e.y > 350) { // Gates reached player
                         // Determine which side player is on
                         if (playerX < 160) selectedPath = 'ev';
                         else selectedPath = 'araba';
                         gameOver();
                    }
                }
                else if (e.active) {
                    // Collision Detection
                    // Player is roughly at y=400, width=40, height=60
                    const dx = Math.abs(playerX - e.x);
                    const dy = Math.abs(400 - e.y);

                    if (dx < 30 && dy < 40) {
                        e.active = false;
                        if (e.type === 'good') {
                            score += 5000;
                            createExplosion(e.x, e.y, COLOR_GOLD);
                        } else {
                            score = Math.max(0, score - 2000);
                            createExplosion(e.x, e.y, COLOR_RED);
                            // Shake effect could go here
                        }
                        updateScore();
                    }
                }

                // Cleanup
                if (e.y > 500) entities.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 20,
                    color: color
                });
            }
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = new Intl.NumberFormat('tr-TR').format(score);
        }

        // --- Drawing ---

        function draw() {
            // Background
            ctx.fillStyle = '#555'; // Road color
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grass sides
            ctx.fillStyle = COLOR_GRASS;
            ctx.fillRect(0, 0, 10, canvas.height);
            ctx.fillRect(310, 0, 10, canvas.height);

            // Lane markers
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -gameTime * speed; // Moving effect
            ctx.beginPath();
            ctx.moveTo(110, 0); ctx.lineTo(110, 480);
            ctx.moveTo(210, 0); ctx.lineTo(210, 480);
            ctx.stroke();

            // Entities
            entities.forEach(e => {
                if (!e.active && e.type !== 'gates') return;

                if (e.type === 'good') {
                    // Gold Coin / Safe
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.scale(e.scale, e.scale);
                    ctx.fillStyle = COLOR_GOLD;
                    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
                    ctx.fillText('₺', 0, 2);
                    ctx.restore();
                } else if (e.type === 'bad') {
                    // Red Barrier / Interest
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.scale(e.scale, e.scale);
                    ctx.fillStyle = COLOR_RED;
                    ctx.fillRect(-20, -20, 40, 40);
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('FAİZ', 0, 4);
                    ctx.restore();
                } else if (e.type === 'gates') {
                    // Final Choice Gates
                    const y = e.y;

                    // Left Gate (Home)
                    ctx.fillStyle = '#3498db';
                    ctx.fillRect(0, y, 155, 100);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('EV', 77, y + 50);

                    // Right Gate (Car)
                    ctx.fillStyle = COLOR_RED;
                    ctx.fillRect(165, y, 155, 100);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('ARABA', 242, y + 50);

                    // Gate Post
                    ctx.fillStyle = '#222';
                    ctx.fillRect(155, y, 10, 100);
                }
            });

            // Player
            ctx.save();
            ctx.translate(playerX, 400);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(0, 30, 20, 10, 0, 0, Math.PI*2); ctx.fill();

            // Body (Sinpas Colors)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.roundRect(-20, -30, 40, 60, 10);
            ctx.fill();
            // Stripe
            ctx.fillStyle = COLOR_RED;
            ctx.fillRect(-20, -10, 40, 20);
            // Logo text
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial'; ctx.textAlign = 'center';
            ctx.fillText('SİNPAŞ', 0, 4);
            ctx.restore();

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        function loop() {
            if (isGameOver) return;
            update();
            draw();
            gameLoopId = requestAnimationFrame(loop);
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);

            // Show End Screen
            document.getElementById('hud').style.display = 'none';
            const endScreen = document.getElementById('endScreen');
            endScreen.classList.remove('hidden');
            document.getElementById('finalScoreDisplay').innerText = new Intl.NumberFormat('tr-TR').format(score) + " TL";

            // Add visual flair based on selection
            if(selectedPath === 'ev') {
                endScreen.style.background = 'linear-gradient(rgba(0,0,0,0.9), rgba(52, 152, 219, 0.4))';
            } else {
                endScreen.style.background = 'linear-gradient(rgba(0,0,0,0.9), rgba(212, 46, 18, 0.4))';
            }
        }

        function submitLead() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            let baseUrl = selectedPath === 'araba' ? urlAraba : urlEv;
            if(!baseUrl) baseUrl = urlEv; // Fallback if died before gate selection logic fully registered (edge case)

            const finalUrl = new URL(baseUrl);
            finalUrl.searchParams.append('name', name);
            finalUrl.searchParams.append('phone', phone);
            finalUrl.searchParams.append('score', score);

            window.open(finalUrl.toString(), '_blank');
        }

    </script>
</body>
</html>
