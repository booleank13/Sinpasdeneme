<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinpaş Playable Ad</title>
    <style>
        /* Resets and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* Ad Container */
        #ad-container {
            width: 320px;
            height: 480px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            border-radius: 8px;
        }

        /* Background Decoration */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 0;
            opacity: 0.5;
        }

        /* Header */
        header {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            z-index: 10;
            position: relative;
        }

        header img {
            max-height: 35px;
            max-width: 80%;
        }

        /* Progress Bar */
        .progress-bar {
            height: 4px;
            width: 100%;
            background-color: #f0f0f0;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background-color: #D42E12;
            width: 33%;
            transition: width 0.5s ease;
        }

        /* Main Views */
        main {
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.5s ease;
        }

        .view.hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .view.hidden-left { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .view.active { transform: translateX(0); opacity: 1; pointer-events: auto; }

        /* Typography */
        h1 {
            font-size: 20px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 10px;
            color: #222;
        }

        p.subtitle {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* --- STEP 1: Selection --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-card {
            background: linear-gradient(145deg, #ffffff, #f9f9f9);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-card:hover { border-color: #D42E12; transform: translateY(-3px); }
        .option-icon { width: 48px; height: 48px; margin-bottom: 10px; fill: #555; transition: fill 0.3s; }
        .option-card:hover .option-icon { fill: #D42E12; }
        .option-label { font-size: 16px; font-weight: 700; color: #555; }
        .option-card:hover .option-label { color: #D42E12; }

        /* --- STEP 2: Budget Slider --- */
        .budget-display {
            font-size: 28px;
            font-weight: 800;
            color: #D42E12;
            margin: 15px 0;
            text-align: center;
        }
        .slider-container { width: 100%; padding: 0 10px; margin-bottom: 20px; }
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: #e0e0e0; border-radius: 3px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 24px; height: 24px; border-radius: 50%;
            background: #D42E12; cursor: pointer;
            box-shadow: 0 0 0 4px rgba(212, 46, 18, 0.2);
        }
        .benefit-tags {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
        }
        .tag {
            background-color: #fff0ed; color: #D42E12;
            padding: 5px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600;
        }
        .btn-next {
            width: 100%; padding: 14px; background: #333; color: white;
            border: none; border-radius: 30px; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-top: 10px;
        }

        /* --- STEP 3: Scratch Card --- */
        .scratch-wrapper {
            position: relative;
            width: 240px;
            height: 120px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            /* Prevent touch actions on canvas so we can draw */
            touch-action: none;
        }

        .prize-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #D42E12, #ff6b6b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .prize-text { font-size: 12px; font-weight: 600; opacity: 0.9; }
        .prize-value { font-size: 20px; font-weight: 800; margin-top: 5px; text-transform: uppercase; }

        canvas {
            position: absolute;
            top: 0; left: 0;
            cursor: crosshair;
        }

        .btn-cta {
            width: 100%;
            padding: 16px;
            background: #D42E12;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(212, 46, 18, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        .btn-cta.visible {
            opacity: 1; transform: translateY(0); pointer-events: auto;
        }
        .btn-cta svg { width: 20px; height: 20px; fill: white; }

        /* Confetti */
        .particle {
            position: absolute; width: 6px; height: 6px;
            background: #D42E12; pointer-events: none; z-index: 100;
        }

        footer {
            text-align: center; font-size: 10px; color: #aaa;
            padding: 10px; background: #fff; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ad-container">
        <div class="bg-pattern"></div>

        <header>
            <img src="https://www.sinpasyts.com/arabalanding/assets/images/logo.png" alt="Sinpaş Logo">
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <main>
            <!-- View 1: Selection -->
            <div class="view active" id="view-1">
                <h1>Hayalinizdeki Hangisi?</h1>
                <p class="subtitle">Seçiminizi yapın.</p>
                <div class="options-grid">
                    <div class="option-card" onclick="goToStep2('ev')">
                        <svg class="option-icon" viewBox="0 0 24 24"><path d="M12 3L2 12H5V20H19V12H22L12 3ZM12 5.8L17 10.3V18H14V13H10V18H7V10.3L12 5.8Z"/></svg>
                        <span class="option-label">EV</span>
                    </div>
                    <div class="option-card" onclick="goToStep2('araba')">
                        <svg class="option-icon" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5H6.5C5.84 5 5.28 5.42 5.08 6.01L3 12V20C3 20.55 3.45 21 4 21H5C5.55 21 6 20.55 6 20V19H18V20C18 20.55 18.45 21 19 21H20C20.55 21 21 20.55 21 20V12L18.92 6.01ZM6.5 6.5H17.5L18.5 9H5.5L6.5 6.5ZM5 17V12H19V17H5ZM7.5 16C8.33 16 9 15.33 9 14.5C9 13.67 8.33 13 7.5 13C6.67 13 6 13.67 6 14.5C6 15.33 6.67 16 7.5 16ZM16.5 16C17.33 16 18 15.33 18 14.5C18 13.67 17.33 13 16.5 13C15.67 13 15 13.67 15 14.5C15 15.33 15.67 16 16.5 16Z"/></svg>
                        <span class="option-label">ARABA</span>
                    </div>
                </div>
            </div>

            <!-- View 2: Budget -->
            <div class="view hidden-right" id="view-2">
                <h1>Aylık Taksit Tutarınız</h1>
                <p class="subtitle">Ödeme planınızı belirleyin.</p>
                <div class="budget-display" id="budget-value">5.000 TL</div>
                <div class="slider-container">
                    <input type="range" min="1000" max="50000" step="500" value="5000" oninput="updateBudget(this.value)">
                </div>
                <div class="benefit-tags">
                    <div class="tag">Faizsiz</div>
                    <div class="tag">Peşinatsız</div>
                    <div class="tag">Kefilsiz</div>
                </div>
                <button class="btn-next" onclick="goToStep3()">DEVAM ET</button>
            </div>

            <!-- View 3: Scratch Card -->
            <div class="view hidden-right" id="view-3">
                <h1>Sürprizi Yakala!</h1>
                <p class="subtitle">Fırsatı görmek için alanı kazıyın.</p>

                <div class="scratch-wrapper" id="scratch-wrapper">
                    <div class="prize-layer">
                        <span class="prize-text">SİZE ÖZEL FIRSAT</span>
                        <span class="prize-value">DOSYA MASRAFI<br>BİZDEN!</span>
                    </div>
                    <canvas id="scratch-canvas" width="240" height="120"></canvas>
                </div>

                <button class="btn-cta" id="final-cta" onclick="handleFinalClick()">
                    HEMEN BAŞVUR
                </button>
            </div>
        </main>

        <footer>
            Sinpaş Tasarruf Finansman A.Ş.
        </footer>
    </div>

    <script>
        let selectedType = null;
        const urlAraba = "https://www.sinpasyts.com/arabalanding/?utm_source=tagon-cpm-crmmedya&utm_medium=desktop-postitial&utm_campaign=kirmizi-tablo-yeni-aracini-alacaklara-mujde-arac-finansmaninda-beklenen-destek";
        const urlEv = "https://www.sinpasyts.com/";

        // --- Navigation ---
        function goToStep2(type) {
            selectedType = type;
            document.getElementById('progress-fill').style.width = '66%';
            transition('view-1', 'view-2');
        }

        function goToStep3() {
            document.getElementById('progress-fill').style.width = '100%';
            transition('view-2', 'view-3');
            initScratchCard();
        }

        function transition(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(fromId).classList.add('hidden-left');
            document.getElementById(toId).classList.remove('hidden-right');
            document.getElementById(toId).classList.add('active');
        }

        function updateBudget(val) {
            const formatted = new Intl.NumberFormat('tr-TR').format(val);
            document.getElementById('budget-value').innerText = formatted + " TL";
        }

        function handleFinalClick() {
            const target = selectedType === 'araba' ? urlAraba : urlEv;
            window.open(target, '_blank');
        }

        // --- Scratch Card Logic ---
        let isDrawing = false;
        let isRevealed = false;

        function initScratchCard() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('scratch-wrapper');

            // Fill with silver
            ctx.fillStyle = '#CCCCCC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add text "Kazı"
            ctx.font = '20px sans-serif';
            ctx.fillStyle = '#888888';
            ctx.textAlign = 'center';
            ctx.fillText('KAZI', canvas.width/2, canvas.height/2 + 8);

            // Add slight noise/pattern to make it look like a scratch card
            for(let i=0; i<500; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#bbbbbb' : '#dddddd';
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            }

            // Events
            const startDraw = (e) => { isDrawing = true; scratch(e); };
            const endDraw = () => { isDrawing = false; checkReveal(); };
            const moveDraw = (e) => { if(isDrawing) scratch(e); };

            // Mouse
            canvas.addEventListener('mousedown', startDraw);
            window.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mousemove', moveDraw);

            // Touch
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
            window.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); });

            function scratch(e) {
                if(isRevealed) return;

                const rect = canvas.getBoundingClientRect();
                let x, y;

                if(e.touches) {
                    x = e.touches[0].clientX - rect.left;
                    y = e.touches[0].clientY - rect.top;
                } else {
                    x = e.clientX - rect.left;
                    y = e.clientY - rect.top;
                }

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 15, 0, 2 * Math.PI);
                ctx.fill();
            }

            function checkReveal() {
                if(isRevealed) return;

                // Simple pixel check (check every 10th pixel for performance)
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let transparentPixels = 0;
                const totalPixels = imageData.data.length / 4;

                for (let i = 0; i < totalPixels; i += 10) {
                    if (imageData.data[i * 4 + 3] === 0) {
                        transparentPixels++;
                    }
                }

                // If > 40% cleared (accounting for sampling)
                if ((transparentPixels * 10) > (totalPixels * 0.4)) {
                    revealAll();
                }
            }

            function revealAll() {
                isRevealed = true;
                canvas.style.transition = 'opacity 0.5s';
                canvas.style.opacity = '0';
                setTimeout(() => { canvas.style.display = 'none'; }, 500);

                // Show CTA
                document.getElementById('final-cta').classList.add('visible');
                spawnConfetti();
            }
        }

        function spawnConfetti() {
            const container = document.getElementById('ad-container');
            const colors = ['#D42E12', '#FF6B6B', '#FFCC00'];
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                container.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;

                particle.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out' }).onfinish = () => particle.remove();
            }
        }
    </script>
</body>
</html>
