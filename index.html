<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinpaş Playable Ad</title>
    <style>
        /* Resets and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* Ad Container */
        #ad-container {
            width: 320px;
            height: 480px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            border-radius: 8px;
        }

        /* Background Decoration */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 0;
            opacity: 0.5;
        }

        /* Header */
        header {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            z-index: 10;
            position: relative;
        }

        header img {
            max-height: 40px;
            max-width: 80%;
        }

        /* Progress Bar (Step Indicator) */
        .progress-bar {
            height: 4px;
            width: 100%;
            background-color: #f0f0f0;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background-color: #D42E12;
            width: 33%; /* Step 1 width */
            transition: width 0.5s ease;
        }

        /* Main Views Container */
        main {
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.5s ease;
        }

        .view.hidden-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .view.hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .view.active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography */
        h1 {
            font-size: 22px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 10px;
            color: #222;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* --- STEP 1: Selection --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-card {
            background: linear-gradient(145deg, #ffffff, #f9f9f9);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-card:hover {
            border-color: #D42E12;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 46, 18, 0.1);
        }

        .option-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            fill: #555;
            transition: fill 0.3s;
        }

        .option-card:hover .option-icon { fill: #D42E12; }

        .option-label {
            font-size: 16px;
            font-weight: 700;
            color: #555;
        }
        .option-card:hover .option-label { color: #D42E12; }

        /* --- STEP 2: Budget Slider --- */
        .budget-display {
            font-size: 32px;
            font-weight: 800;
            color: #D42E12;
            margin: 20px 0;
            text-align: center;
        }

        .slider-container {
            width: 100%;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #D42E12;
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(212, 46, 18, 0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        .benefit-tags {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tag {
            background-color: #fff0ed;
            color: #D42E12;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            animation: popIn 0.5s ease forwards;
        }
        .tag:nth-child(1) { animation-delay: 0.2s; }
        .tag:nth-child(2) { animation-delay: 0.3s; }
        .tag:nth-child(3) { animation-delay: 0.4s; }

        .tag svg { width: 12px; height: 12px; fill: currentColor; }

        /* CTA Button */
        .btn-cta {
            width: 100%;
            padding: 16px;
            background: #D42E12;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(212, 46, 18, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s;
        }
        .btn-cta:active { transform: scale(0.98); }
        .btn-cta svg { width: 20px; height: 20px; fill: white; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 10px;
            color: #aaa;
            padding: 10px;
            background: #fff;
            z-index: 10;
        }

    </style>
</head>
<body>

    <div id="ad-container">
        <div class="bg-pattern"></div>

        <header>
            <img src="https://www.sinpasyts.com/arabalanding/assets/images/logo.png" alt="Sinpaş Logo">
        </header>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <main>
            <!-- View 1: Selection -->
            <div class="view active" id="view-1">
                <h1>Hayalinizdeki Hangisi?</h1>
                <p class="subtitle">Size en uygun tasarruf planını oluşturmak için seçiminizi yapın.</p>

                <div class="options-grid">
                    <div class="option-card" onclick="goToStep2('ev')">
                        <svg class="option-icon" viewBox="0 0 24 24"><path d="M12 3L2 12H5V20H19V12H22L12 3ZM12 5.8L17 10.3V18H14V13H10V18H7V10.3L12 5.8Z"/></svg>
                        <span class="option-label">EV</span>
                    </div>
                    <div class="option-card" onclick="goToStep2('araba')">
                        <svg class="option-icon" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5H6.5C5.84 5 5.28 5.42 5.08 6.01L3 12V20C3 20.55 3.45 21 4 21H5C5.55 21 6 20.55 6 20V19H18V20C18 20.55 18.45 21 19 21H20C20.55 21 21 20.55 21 20V12L18.92 6.01ZM6.5 6.5H17.5L18.5 9H5.5L6.5 6.5ZM5 17V12H19V17H5ZM7.5 16C8.33 16 9 15.33 9 14.5C9 13.67 8.33 13 7.5 13C6.67 13 6 13.67 6 14.5C6 15.33 6.67 16 7.5 16ZM16.5 16C17.33 16 18 15.33 18 14.5C18 13.67 17.33 13 16.5 13C15.67 13 15 13.67 15 14.5C15 15.33 15.67 16 16.5 16Z"/></svg>
                        <span class="option-label">ARABA</span>
                    </div>
                </div>
            </div>

            <!-- View 2: Budget -->
            <div class="view hidden-right" id="view-2">
                <h1>Aylık Taksit Tutarınız</h1>
                <p class="subtitle">Bütçenize uygun ödeme planını belirleyin.</p>

                <div class="budget-display" id="budget-value">5.000 TL</div>

                <div class="slider-container">
                    <input type="range" min="1000" max="50000" step="500" value="5000" id="budget-range" oninput="updateBudget(this.value)">
                </div>

                <div class="benefit-tags">
                    <div class="tag">
                        <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg> Faizsiz
                    </div>
                    <div class="tag">
                        <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg> Peşinatsız
                    </div>
                    <div class="tag">
                        <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg> Kefilsiz
                    </div>
                </div>

                <button class="btn-cta" onclick="handleFinalClick()">
                    PLANLARI GÖR
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </button>
            </div>
        </main>

        <footer>
            Sinpaş Tasarruf Finansman A.Ş.
        </footer>
    </div>

    <script>
        let selectedType = null;
        const urlAraba = "https://www.sinpasyts.com/arabalanding/?utm_source=tagon-cpm-crmmedya&utm_medium=desktop-postitial&utm_campaign=kirmizi-tablo-yeni-aracini-alacaklara-mujde-arac-finansmaninda-beklenen-destek";
        const urlEv = "https://www.sinpasyts.com/";

        function goToStep2(type) {
            selectedType = type;

            // Update Progress Bar
            document.getElementById('progress-fill').style.width = '66%';

            // Transition Views
            document.getElementById('view-1').classList.remove('active');
            document.getElementById('view-1').classList.add('hidden-left');

            document.getElementById('view-2').classList.remove('hidden-right');
            document.getElementById('view-2').classList.add('active');

            // Reset Slider animation slightly
            const display = document.getElementById('budget-value');
            display.style.transform = 'scale(1.2)';
            setTimeout(() => display.style.transform = 'scale(1)', 300);
        }

        function updateBudget(val) {
            // Format Currency
            const formatted = new Intl.NumberFormat('tr-TR').format(val);
            document.getElementById('budget-value').innerText = formatted + " TL";
        }

        function handleFinalClick() {
            // Animate progress to full
            document.getElementById('progress-fill').style.width = '100%';

            setTimeout(() => {
                const target = selectedType === 'araba' ? urlAraba : urlEv;
                window.open(target, '_blank');
            }, 300);
        }
    </script>
</body>
</html>
